repos:
  - repo: https://github.com/cpp-linter/cpp-linter-hooks
    rev: v0.6.1  # Use the ref you want to point at
    hooks:
      - id: clang-format
        # Style comes from the repo's own .clang-format (clang-format's
        # default --style is already "file"); no args needed here anymore.
        files: ^(src|tests)/.*\.(cpp|cc|cxx|h|hpp)$
